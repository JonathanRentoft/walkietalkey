# XcodeGen spec for the WalkieTalkey iOS shell (spec 7.1, PHONE-02..04, PHONE-11, PHONE-13, PHONE-27).
# `xcodegen generate` (run in ios/) writes WalkieTalkey.xcodeproj and Support/Info.plist from this
# file; neither is in git. Run `bash ios/scripts/bundle-phone.sh` first so Web/ holds the phone build.
name: WalkieTalkey

options:
  bundleIdPrefix: com.walkietalkey
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: da
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  WalkieTalkey:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WalkieTalkey
      # The phone build, copied by scripts/bundle-phone.sh. A folder reference keeps the directory
      # structure, so the scheme handler finds Web/assets/... in the app bundle.
      - path: Web
        type: folder
        buildPhase: resources
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: WalkieTalkey
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen:
          UIColorName: Background
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # TODO(copy): Danish permission texts drafted for the owner to approve (spec Appendix A).
        NSMicrophoneUsageDescription: "WalkieTalkey skal bruge mikrofonen for at høre dig."
        NSCameraUsageDescription: "WalkieTalkey bruger kameraet til at scanne koden på din computer."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkietalkey.ios
        PRODUCT_NAME: WalkieTalkey
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: NO
        # Universal Links (PHONE-11) need a signing team. Once the Apple Developer team exists, add
        # DEVELOPMENT_TEAM and CODE_SIGN_ENTITLEMENTS: Support/WalkieTalkey.entitlements here
        # (ios/README.md). Until then CI builds with CODE_SIGNING_ALLOWED=NO.

  WalkieTalkeyTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WalkieTalkeyTests
    dependencies:
      - target: WalkieTalkey
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.walkietalkey.ios.tests
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"

schemes:
  WalkieTalkey:
    build:
      targets:
        WalkieTalkey: all
        WalkieTalkeyTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - WalkieTalkeyTests
    archive:
      config: Release
