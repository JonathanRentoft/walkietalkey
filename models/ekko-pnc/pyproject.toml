[project]
name = "wt-ekko-pnc-golden"
version = "0.1.0"
description = "Generates the Ekko PnC golden set with the reference tool (ekko-stt) for crates/ekko-pnc"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    # The reference implementation and the runtime versions it pins.
    "ekko-stt[pnc]==0.1.2",
    "onnxruntime==1.29.0",
    "tokenizers==0.22.2",
]

[tool.uv]
package = false
