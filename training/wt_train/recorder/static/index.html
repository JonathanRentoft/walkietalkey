<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indtaling</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Indtaling</h1>
      <p id="progress" aria-live="polite">Henter sætninger</p>
    </header>

    <section id="input" aria-label="Mikrofon">
      <label for="device">Mikrofon</label>
      <select id="device"></select>
      <div class="meter" aria-hidden="true">
        <div id="level"></div>
        <div id="peak"></div>
      </div>
      <span id="db">-∞ dB</span>
    </section>

    <p id="warning" role="alert" hidden></p>

    <main>
      <p id="meta"><span id="sid"></span> <span id="badge"></span></p>
      <p id="sentence" lang="da"></p>
    </main>

    <nav id="controls">
      <button id="prev" type="button" title="Venstre pil">← Forrige</button>
      <button id="record" type="button" class="primary" title="Mellemrum">
        Optag
      </button>
      <button id="redo" type="button" title="R">Optag igen</button>
      <button id="play" type="button" title="P">Afspil</button>
      <button id="next" type="button" title="Højre pil">Næste →</button>
    </nav>

    <p id="message" role="status" aria-live="polite"></p>

    <footer>
      <label
        ><input id="advance" type="checkbox" checked /> Gå videre til næste
        sætning efter hver optagelse</label
      >
      <p>
        Mellemrum: optag og stop. R: optag igen. P: afspil. Pile: forrige og
        næste. Esc: annuller. Optagelserne bliver på denne Mac.
      </p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
