<!doctype html>
<html lang="da">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Indtaling</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <h1>Indtaling <span id="condition"></span></h1>
      <p id="progress" aria-live="polite">Henter sætninger</p>
      <p id="pilot" hidden></p>
    </header>

    <section id="link" aria-live="polite">
      <p id="link-text">Venter på WalkieTalkey på denne Mac</p>
      <button id="connect" type="button" hidden>Forbind</button>
    </section>

    <table id="conditions" aria-label="Fremskridt">
      <tbody></tbody>
    </table>

    <main>
      <p id="meta"><span id="sid"></span> <span id="badge"></span></p>
      <p id="sentence" lang="da"></p>
      <p id="hint"></p>
    </main>

    <section id="last" hidden>
      <p id="last-text"></p>
    </section>

    <nav id="controls">
      <button id="prev" type="button" title="Venstre pil">← Forrige</button>
      <button id="record" type="button" class="primary" title="Mellemrum">
        Optag
      </button>
      <button id="redo" type="button" title="R">Optag forrige igen</button>
      <button id="play" type="button" title="P">Afspil</button>
      <button id="next" type="button" title="Højre pil">Næste →</button>
    </nav>

    <p id="message" role="status" aria-live="polite"></p>

    <footer>
      <p id="keys"></p>
      <p>
        Lyden optages gennem WalkieTalkey, præcis som når du dikterer, og
        optagelserne bliver på denne Mac.
      </p>
    </footer>

    <script type="module" src="/app.js"></script>
  </body>
</html>
