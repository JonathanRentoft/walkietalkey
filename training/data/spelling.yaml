      APIet: API'et
      API-er: API'er
      APIer: API'er
      API-erne: API'erne
      APIerne: API'erne
  frontend:
    forms: [frontend, frontenden]
    also:
      front end: frontend
      front-end: frontend
      front-enden: frontenden
  backend:
    forms: [backend, backenden]
    also:
      back end: backend
      back-end: backend
      back-enden: backenden
  database:
    forms: [database, databasen, databaser, databaserne]
  migration:
    forms: [migration, migrationen, migrationer]
  dashboard:
