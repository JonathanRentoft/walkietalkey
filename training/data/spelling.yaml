# Spelling conventions for English developer terms in Danish text.
#
# One entry per term under `terms`, keyed by the term's name (a label only):
#
#   forms:  the spellings we write, one per spoken form of the term. Write a
#           form the way it is said: "deployede" for the Danish past tense,
#           "commits" for the English plural that Danish developers say.
#   also:   other spellings of those same spoken forms, each mapped to the
#           form it means ("PR-en: PR'en"). Optional. Never put a different
#           spoken form here ("deployed" is not "deployede"), only another
#           way of writing the same one. Never an ordinary Danish word either:
#           the dataset builder rewrites `also` spellings in FLEURS text too.
#
# Who reads this file:
#   * The dataset builder (wt-train build) rewrites every `also` spelling in a
#     transcript into its form before training, so the model learns exactly
#     one spelling per spoken form.
#   * The evaluation (wt-train eval) finds the forms in each reference and
#     counts a term right only when the hypothesis has that same form there.
#     A form that is not listed here is not counted as a term at all.
#   * The sentence list (sentences.csv) uses only `forms`; its tests fail on
#     any `also` spelling, on a terms sentence without a form, and on a plain
#     sentence with one.
#
# Matching: whole words, case does not count ("Deployet" at a sentence start
# is "deployet"). An apostrophe ending belongs to the word, so "PR" does not
# match in "PR'en". A hyphen ends a word, so "React-appen" contains "React".
# A hyphen inside a form is part of the form ("fine-tunede", "merge-konflikten"),
# and neither half counts on its own; every such form has its closed spelling
# under `also` ("finetunede"). The WER normaliser splits a hyphen like a space
# and joins it where the other text writes the word closed, so all three
# spellings score the same.
# The longest form wins: "pull requesten" before "pull request" before "PR",
# "Claude Code" before "Claude", "merge-konflikten" before "merge".
#
# Rules the loader enforces (it stops with a message naming the spelling):
#   * a spelling is listed once in the whole file, as a form or under also;
#   * every `also` target is one of that term's own forms.
#
# Conventions (Dansk Sprognævn practice for English loanwords):
#   * Verbs take Danish endings on the English stem: infinitive -e (deploye),
#     present -er (deployer), past -ede (deployede), participle -et (deployet),
#     passive -es (deployes). The imperative is the bare stem (deploy, merge).
#     A short stressed vowel doubles a final consonant: committe, debugge.
#   * Nouns take Danish definite endings: -en for en-words (branchen, PR'en),
#     -et for et-words (endpointet, API'et); the same doubling (buggen,
#     backloggen, standuppen). Plurals are written as said: mostly the English
#     -s (commits, endpoints), Danish -er where that is what people say (PR'er,
#     databaser).
#   * Abbreviations take their endings after an apostrophe: PR'en, API'et,
#     LLM'erne, CI'en.
#   * Names are written as their owners write them (GitHub, Next.js, VS Code)
#     and take no endings.
#   * Compounds: a name or an abbreviation joins a Danish word with a hyphen
#     (React-appen, API-kald). The sentences avoid closed compounds of English
#     terms ("stagingmiljøet"), because the evaluation would not see the term.
#   * Where Danish developers say a Danish word instead of the English one, the
#     term's forms are that Danish word, under the English term's name:
#     komponent, pakke, datasæt, klone, integrationstest, vektordatabase,
#     merge-konflikt. Where the English word is still what is said, it stays
#     (library, schema, queue), and the Danish word (bibliotek, skema, kø) is
#     plain Danish, not a form. Each choice is noted at its term.
#
# A few forms are ordinary Danish words too (test, database, migration,
# sprint, rust, server, agent, session, container, cookie, demo, flow, pakke,
# komponent, staten): plain-Danish text that uses them counts them as terms, so
# the plain sentences avoid them. Matching ignores case, so the Danish plural
# "teams" counts as Teams and "rust" as Rust: the sentences write a form with
# capitals exactly as listed, and say "holdet" for a team.
#
# To change a convention: edit the form here, put the old spelling under
# `also` (so older transcripts follow), then fix the sentences the tests name
# and record those takes again; the recorder marks a take whose text changed.

terms:
  # Git and GitHub
  pull request:
    forms: [pull request, pull requesten, pull requests]
    also:
      pull-request: pull request
      pullrequest: pull request
      pull-requesten: pull requesten
      pullrequesten: pull requesten
      pull-requests: pull requests
      pullrequests: pull requests
  PR:
    forms: [PR, PR'en, PR'er, PR'erne]
    also:
      PR-en: PR'en
      PRen: PR'en
      PR-er: PR'er
      PRer: PR'er
      PR-erne: PR'erne
      PRerne: PR'erne
  commit:
    # Noun (et commit, committet, commits) and verb (committe ...) share
    # "committet": the noun's definite form and the participle sound alike.
    forms: [commit, commits, committet, committe, committer, committede]
    also:
      commit'et: committet
      commitet: committet
      commit'e: committe
      commite: committe
      commiter: committer
      commitede: committede
  branch:
    forms: [branch, branchen, branches]
    also:
      branch'en: branchen
  main:
    # The default branch: "merge til main".
    forms: [main]
  merge:
    forms: [merge, merger, mergede, merget, merges]
    also:
      merge'et: merget
  merge conflict:
    # Danish developers say "merge-konflikt": the English verb and the Danish
    # noun, joined with a hyphen so the term stays visible. The longest form
    # wins, so "merge-konflikten" is a merge conflict and not a merge.
    forms:
      [merge-konflikt, merge-konflikten, merge-konflikter, merge-konflikterne]
    also:
      mergekonflikt: merge-konflikt
      mergekonflikten: merge-konflikten
      mergekonflikter: merge-konflikter
      mergekonflikterne: merge-konflikterne
      merge konflikt: merge-konflikt
      merge konflikten: merge-konflikten
      merge konflikter: merge-konflikter
      merge conflict: merge-konflikt
  rebase:
    forms: [rebase, rebaser, rebasede, rebaset]
  push:
    forms: [push, pushe, pusher, pushede, pushet]
    also:
      push'e: pushe
      push'ede: pushede
      push'et: pushet
  code review:
    forms: [code review, code reviewet, code reviews]
    also:
      code-review: code review
      codereview: code review
      code-reviewet: code reviewet
      code-reviews: code reviews
  review:
    # Noun (et review, reviewet, reviews) and verb (reviewe ...).
    forms: [review, reviewet, reviews, reviewe, reviewer, reviewede, reviewes]
    also:
      review'et: reviewet
      review'e: reviewe
  repo:
    forms: [repo, repoet, repos, repository]
    also:
      repo'et: repoet
  Git:
    forms: [Git]
  GitHub:
    forms: [GitHub]
    also:
      Git Hub: GitHub
      Git-Hub: GitHub
  GitHub Actions:
    # Longer than GitHub, so it wins.
    forms: [GitHub Actions]
  clone:
    # Danish developers say "klone repoet": the Danish verb at klone, spelled
    # the Danish way. The English spellings of the same forms go under also;
    # the bare "clone" does not, because "git clone" is said in English.
    forms: [klone, kloner, klonede, klonet]
    also:
      clonede: klonede
      clonet: klonet
  fork:
    # Noun (et fork, forket, forks) and verb (forke, forkede, forket).
    forms: [fork, forket, forks, forke, forkede]
  checkout:
    forms: [checkout, checkouten]
    also:
      checkout'en: checkouten
  stash:
    forms: [stash, stashe, stasher, stashede, stashet]
    also:
      stash'e: stashe
  cherry-pick:
    forms:
      [cherry-pick, cherry-picke, cherry-picker, cherry-pickede, cherry-picket]
    also:
      cherrypick: cherry-pick
      cherrypicke: cherry-picke
      cherrypicker: cherry-picker
      cherrypickede: cherry-pickede
      cherrypicket: cherry-picket
      cherry pick: cherry-pick
      cherry picke: cherry-picke
  squash:
    # Also the Danish word for fruit cordial; the plain sentences avoid it.
    forms: [squash, squashe, squasher, squashede, squashet]
  revert:
    # Noun (et revert, revertet) and verb (reverte ...) share "revertet".
    forms: [revert, reverte, reverter, revertede, revertet]
  diff:
    forms: [diff, diffen, diffs]
  tag:
    # A git tag: et tag, tagget, tags; verb tagge, taggede. The bare "tag" is
