  debug:
    forms: [debug, debugge, debugger, debuggede, debugget, debugging]
    also:
      debug'e: debugge
      debuge: debugge
      debugede: debuggede
      debuget: debugget
  refactor:
    forms:
      [refactor, refactore, refactorer, refactorede, refactoret, refactoring]
    also:
      refactor'e: refactore
      refaktore: refactore
      refaktorede: refactorede
      refaktoret: refactoret
      refaktoring: refactoring
  test:
    forms:
      [test, testen, tests, testene, teste, tester, testede, testet, testes]
  unit test:
    # An English open compound with a Danish ending, like "pull requesten".
    # Longer than "test", so "unit testen" is a unit test.
    forms: [unit test, unit testen, unit tests, unit testene]
    also:
      unittest: unit test
      unit-test: unit test
      unittesten: unit testen
      unit-testen: unit testen
      unittests: unit tests
      unit-tests: unit tests
      unittestene: unit testene
      unit-testene: unit testene
  integration test:
    # Danish developers say "integrationstest", the Danish compound with its
    # linking s ("integration" is a Danish word); one word, so "test" is not
    # counted inside it.
    forms:
      [
        integrationstest,
        integrationstesten,
        integrationstests,
        integrationstestene,
      ]
  end-to-end test:
    # An English compound, written as English writes it.
    forms:
      [end-to-end test, end-to-end testen, end-to-end tests, end-to-end testene]
    also:
      end-to-end-test: end-to-end test
      end-to-end-testen: end-to-end testen
      end-to-end-tests: end-to-end tests
      end-to-end-testene: end-to-end testene
      end to end test: end-to-end test
      end to end testen: end-to-end testen
      end to end tests: end-to-end tests
      end to end testene: end-to-end testene
  mock:
    forms: [mock, mocken, mocks, mocke, mocker, mockede, mocket]
    also:
      mock'e: mocke
  cache:
    forms: [cache, cachen, caches, cacher, cachede, cachet]
    also:
      cache'en: cachen
  crash:
    forms: [crash, crashe, crasher, crashede, crashet]
    also:
      crash'e: crashe
      crash'et: crashet
  timeout:
    forms: [timeout, timeouten, timeouts]
    also:
      time-out: timeout
      time-outen: timeouten
      time-outs: timeouts
  dependency:
    forms: [dependency, dependencies]
  component:
    # Danish developers say "komponent" (a React-komponent), the Danish word.
    forms: [komponent, komponenten, komponenter, komponenterne]
  props:
    # Plural only: the singular "prop" is the Danish word for a cork.
    forms: [props]
  state:
    # "staten" is also the Danish word for the state (the government); the
    # plain sentences avoid it.
    forms: [state, staten]
  hook:
    forms: [hook, hooken, hooks]
    also:
      hook'en: hooken
  async:
    forms: [async]
  error:
    forms: [error, erroren, errors]
  exception:
    forms: [exception, exceptionen, exceptions]
  stack trace:
    forms: [stack trace, stack tracen, stack traces]
    also:
      stacktrace: stack trace
      stack-trace: stack trace
      stacktracen: stack tracen
      stack-tracen: stack tracen
      stacktraces: stack traces
      stack-traces: stack traces
  coverage:
    forms: [coverage, coveragen]
  linter:
    forms: [linter, linteren, linters]
  framework:
    forms: [framework, frameworket, frameworks]
    also:
      framework'et: frameworket
  library:
    # "library" is what is said in code talk (et library, libraryet, like
    # partyet). The Danish "bibliotek" is said too, a different word: it stays
    # plain Danish.
    forms: [library, libraryet, libraries]
  package:
    # Danish developers say "pakke" (en npm-pakke, pakken), the Danish word. It
    # is also the everyday word for a parcel and the verb "to pack", which the
    # plain sentences avoid.
    forms: [pakke, pakken, pakker, pakkerne]
  setup:
    # Et setup, setuppet (the doubling of standuppen).
    forms: [setup, setuppet, setups]
    also:
      set-up: setup
      setupet: setuppet
      setup'et: setuppet
  edge case:
    forms: [edge case, edge casen, edge cases]
    also:
      edgecase: edge case
      edge-case: edge case
      edgecasen: edge casen
      edge-casen: edge casen
      edgecases: edge cases
      edge-cases: edge cases

