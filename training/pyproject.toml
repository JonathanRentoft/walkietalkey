[project]
name = "wt-train"
version = "0.1.0"
description = "WalkieTalkey fine-tuning workbench: record sentences, build datasets, train LoRA adapters on Edda, evaluate and export to GGUF"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "torch>=2.9",
    "transformers>=5.6,<6",
    "peft>=0.18",
    "safetensors>=0.6",
    "numpy>=2.1",
    "soundfile>=0.13",
    "soxr>=1.0",
    "pyyaml>=6.0.2",
    "matplotlib>=3.10",
    "huggingface-hub>=1.0",
    "mlflow>=3.17,<4",
]

[project.scripts]
wt-train = "wt_train.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wt_train"]

[dependency-groups]
dev = ["pytest>=9,<10"]
notebooks = [
    "ipykernel>=6.29",
    "jiwer>=4",
    "nbclient>=0.10",
    "nbformat>=5.10",
]

[tool.uv]
# Run 11: the learning notebooks (training/notebooks/) run in this same environment, so
# plain `uv run` installs their kernel and jiwer too.
default-groups = ["dev", "notebooks"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# models/eval is the accuracy job's harness: its normaliser and WER are imported, not copied.
pythonpath = [".", "../models/eval"]
