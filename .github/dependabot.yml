version: 2
# One grouped pull request per ecosystem each week for version updates; security updates come in a
# separate group per ecosystem, so they never wait behind the routine bumps (run 2).
updates:
  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /crates/wt-relay-client
      - /crates/wt-native
      - /crates/ekko-pnc
      - /packages/protocol/rust
    schedule: { interval: weekly }
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Ekko PnC (DESK-41): rc.14 and rc.15 both link ONNX Runtime 1.31.0, which flips 3 commas in
      # 2 of the 52 golden cases against the reference runtime (crates/ekko-pnc/tests/golden.rs);
      # rc.15 also makes Session::builder take an &Environment. rc.13 (ORT 1.28.0) reproduces
      # the reference exactly. A later rc gets proposed and is judged by the golden test.
      - dependency-name: ort
        versions: ["2.0.0-rc.14", "2.0.0-rc.15"]
  # bun.lock is the lockfile; npm updates would leave it behind.
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      bun:
        applies-to: version-updates
        patterns: ["*"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # TypeScript 7 (the native compiler) has no JS API for typescript-eslint 8, which refuses to
      # load with it ("typescript-eslint does not support TS 7.0",
      # github.com/typescript-eslint/typescript-eslint/issues/10940), so `bun run lint` fails.
      - dependency-name: typescript
        versions: [">=7"]
      # React 19: its types fail about 35 places in Handy's desktop UI and packages/ui
      # (RefObject<T | null>, no global JSX namespace, useRef() needs an argument), and Handy is
      # still on React 18. Move together with Handy, in one pull request for all workspaces.
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react-dom"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # The Python tools behind the Ekko PnC golden set and the Danish accuracy harness (models/). The
  # reference runtime (ekko-stt and the onnxruntime and tokenizers it pins) is held at the versions
  # golden.json was generated with: crates/ekko-pnc must match that output exactly, so moving them
  # means regenerating the golden set by hand. Security updates still come, in their own group.
  - package-ecosystem: uv
    directories:
      - /models/ekko-pnc
      - /models/eval
    schedule: { interval: weekly }
    ignore:
      - dependency-name: ekko-stt
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: onnxruntime
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: tokenizers
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      uv:
        applies-to: version-updates
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
