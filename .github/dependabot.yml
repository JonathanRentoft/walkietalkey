version: 2
updates:
  - package-ecosystem: cargo
    directory: /src-tauri
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: cargo
    directory: /crates/wt-relay-client
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /crates/wt-native
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /crates/ekko-pnc
    schedule: { interval: weekly }
  - package-ecosystem: cargo
    directory: /packages/protocol/rust
    schedule: { interval: weekly }
  # bun.lock is the lockfile; npm updates would leave it behind.
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
