version: 2
# One grouped pull request per ecosystem each week for version updates; security updates come in a
# separate group per ecosystem, so they never wait behind the routine bumps (run 2).
updates:
  - package-ecosystem: cargo
    directories:
      - /src-tauri
      - /crates/wt-relay-client
      - /crates/wt-native
      - /crates/ekko-pnc
      - /packages/protocol/rust
    schedule: { interval: weekly }
    groups:
      cargo:
        applies-to: version-updates
        patterns: ["*"]
      cargo-security:
        applies-to: security-updates
        patterns: ["*"]
  # bun.lock is the lockfile; npm updates would leave it behind.
  - package-ecosystem: bun
    directory: /
    schedule: { interval: weekly }
    groups:
      bun:
        applies-to: version-updates
        patterns: ["*"]
      bun-security:
        applies-to: security-updates
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      github-actions:
        applies-to: version-updates
        patterns: ["*"]
      github-actions-security:
        applies-to: security-updates
        patterns: ["*"]
  # The Python tools behind the Ekko PnC golden set and the Danish accuracy harness (models/). The
  # reference runtime (ekko-stt and the onnxruntime and tokenizers it pins) is held at the versions
  # golden.json was generated with: crates/ekko-pnc must match that output exactly, so moving them
  # means regenerating the golden set by hand. Security updates still come, in their own group.
  - package-ecosystem: uv
    directories:
      - /models/ekko-pnc
      - /models/eval
    schedule: { interval: weekly }
    ignore:
      - dependency-name: ekko-stt
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: onnxruntime
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
      - dependency-name: tokenizers
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
          - version-update:semver-patch
    groups:
      uv:
        applies-to: version-updates
        patterns: ["*"]
      uv-security:
        applies-to: security-updates
        patterns: ["*"]
