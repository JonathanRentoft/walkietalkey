[package]
name = "wt-protocol"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WalkieTalkey wire protocol: keys, derivations, encrypted device frames, payloads, control messages and pairing URLs"
publish = false

[features]
default = []
# Test-only helpers: fixed nonces for reproducible test vectors. Never enable in production.
test-utils = []

[dependencies]
p256 = { version = "0.14", features = ["ecdsa", "ecdh", "pkcs8"] }
hkdf = "0.13"
hmac = "0.13"
aes-gcm = "0.11"
sha2 = "0.11"
getrandom = "0.4"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
zeroize = { version = "1", features = ["derive"] }
subtle = "2"

[dev-dependencies]
wt-protocol = { path = ".", features = ["test-utils"] }
proptest = "1"
hex = "0.4"

[[example]]
name = "gen_test_vectors"
required-features = ["test-utils"]
