[package]
name = "wt-relay-client"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "WalkieTalkey desktop relay client: the computer's side of a room (connect, pair, receive encrypted audio, send results)"
publish = false

[features]
default = []
# Allows ws:// to localhost in release builds too (integration tests). Debug builds allow it
# when ClientConfig::allow_insecure_localhost is set; release builds never do without this.
insecure-localhost = []

[dependencies]
wt-protocol = { path = "../../packages/protocol/rust" }
tokio = { version = "1.43", features = ["rt", "macros", "sync", "time", "net"] }
tokio-tungstenite = { version = "0.30", features = ["native-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
log = "0.4"
zeroize = "1"

[dev-dependencies]
tokio = { version = "1.43", features = ["full"] }
hex = "0.4"
